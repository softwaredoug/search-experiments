strategy:
  name: codegen_start_code_path_marker_fixture
  type: codegen
  path: __RUN_PATH__
  params:
    train:
      model: gpt-5-mini
      reasoning: low
      rounds: 0
      refresh_every: 1
      search_tools:
        - get_corpus
      start_code: |
        START_CODE_SENTINEL = True

        def reranker(query, top_k, get_corpus, **kwargs):
            corpus = get_corpus()
            return [str(doc_id) for doc_id in corpus.head(top_k)["doc_id"].tolist()]
      edit:
        guards:
          - length
      eval:
        train_fraction: 0.2
        seed: 123
        eval_margin: 0.0
      system_prompt: |
        Improve the reranker.
    run:
      top_k: 5
