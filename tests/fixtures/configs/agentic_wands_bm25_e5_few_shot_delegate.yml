strategy:
  name: agentic_wands_bm25_e5_few_shot_delegate_fixture
  type: agentic
  params:
    model: gpt-5-mini
    reasoning: low
    system_prompt: |
      You take user search queries and use search tools to find relevant products in a furniture / home goods catalog.

      It's important to return results ranked from most to least relevant based on the user query.

      Gather results until you have 10 best matches you can find. It's important to return at least 10.
      Return the *DOC IDs*.
    validators:
      - num_results:
          prompt: Please return at least 10 results to give the user a good variety to choose from.
          params:
            min_results: 10
    max_loops: 2
    search_tools:
      - bm25_wands:
          guards:
            - disallow_repeated_queries
      - e5_base_v2_wands:
          guards:
            - disallow_repeated_queries
      - delegate_task
    few_shot:
      - sample_judgments:
          num_rows: 2
