repos:
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
        timeout: 10
      - id: uv-check-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
