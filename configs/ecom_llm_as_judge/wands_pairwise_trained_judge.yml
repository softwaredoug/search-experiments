strategy:
  name: wands_pairwise_trained_judge
  type: pairwise_trained_judge
  description: WANDS pairwise relevance classifier trained on title, description, and category hierarchy judge features.
  params:
    train:
      cross_validation: 5
    sample_size: 10
    sampling_seed: 42
    to_pointwise: copeland
    model:
      type: decision_tree
      params:
        prediction_threshold: 0.7
    features:
      - title:
          model: jev/jev-latest
          prompt: |
            Query: {query}

            LHS Doc:
            Title: {title_lhs}

            RHS Doc:
            Title: {title_rhs}
          question: Which document is more relevant to the query?
      - description:
          empty_value: No Description Provided
          model: jev/jev-latest
          system_prompt: You are a careful search relevance judge.
          prompt: |
            Query: {query}

            LHS Doc:
            Description: {description_lhs}

            RHS Doc:
            Description: {description_rhs}
          question: Which document is more relevant to the query?
      - category_hierarchy:
          model: jev/jev-latest
          prompt: |
            Query: {query}

            LHS Product Category Hierarchy: {category hierarchy_lhs}

            RHS Product Category Hierarchy: {category hierarchy_rhs}
          question: Which product category hierarchy is more relevant to the e-commerce search query?
