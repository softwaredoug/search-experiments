strategy:
  name: ecom_query_understanding_llm_single
  type: query_understanding
  params:
    reasoning: medium
    categorize:
      field: category
      enrichment_engine:
        type: llm_single
        model: gpt-5-mini
        params:
          prompt: |
            For the given query, please generate the appropriate {field} to filter to zero-in on
            the most relevant results.

            If you're unsure, or the query is ambiguous, return "Unknown" as the category.

            Here's the query:

            {query}
    retrieval_engine:
      base: bm25_boosted
      params:
        fields: [title^9.4, description^4]
        boost_matches: 10
