strategy:
  name: ecom_qu_category_hierarchy_bm25_hierarchy_boosted_llm_single
  type: query_understanding
  params:
    reasoning: medium
    categorize:
      field: category hierarchy
      enrichment_engine:
        type: llm_single
        model: gpt-5-mini
        params:
          prompt: |
            Below is a search query for a furniture / homegoods store. Your job
            is to classify the query into the single most relevant category.

            For the given query, generate the appropriate {field} value to
            boost and zero in on the most relevant results. Categories are
            hierarchical and use / separators. If you're unsure or the query
            is ambiguous, return "Unknown".

            Here's the query:

            {query}
    retrieval_engine:
      base: bm25_hierarchy_boosted
      params:
        fields: [title^9.4, description^4]
        boost_matches: 10
        decay: 0.5
