strategy:
  name: agentic_ecom_orchestrate_bash_wands_gpt5_mini
  type: agentic
  description: |
    Orchestrated agentic search using the sandboxed bash filesystem tool over the WANDS dataset.
  params:
    topology: orchestrate
    model: gpt-5-mini
    reasoning: low
    first_system_prompt: |
      You take user search queries to find relevant products.

      Return your steps / a plan. Use the other tools to explore the file system and find results to formulate 
      or adjust the plan

      Once the plan is good, return it.

    processing_system_prompt: |
      You take user search queries to find relevant products using the plan below.

      You can explore the file system directly or 
      delegate your steps / ideas to subagents using the task tool

      Use the task tool to delegate searches / parts of your plan
      
      Gather results until you have 10 best matches you can find. It's important to return at least 10.
      It's important to rank them from most to learst relevant.

      Return the *DOC IDs*, not paths, in the response. IE above, you would return "1234", not "red-shoes-1234.txt".
    subagent_system_prompt: |
      You help with tasks searchinging / finding content as instructed.
      
      The bash tool runs inside a sandboxed container with the corpus
    search_tools:
      - bash_wands
