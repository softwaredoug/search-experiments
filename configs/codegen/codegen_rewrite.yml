strategy:
  name: codegen_rewrite
  type: codegen
  params:
    train:
      model: gpt-5
      refresh_every: 3
      search_tools:
        - fielded_bm25
        - e5_base_v2
        - query_rewrite:                                                                        
             model: gpt-5-mini                                                                   
             max_alternatives: 5                                                                 
      edit:
        guards:
          - validation
          - length:
              max_lines: 10
              max_cols: 120
          - overfit:
              model: openai/gpt-5-mini
      eval:
        train_fraction: 0.20
        seed: 1234
        eval_margin: 0.002
      system_prompt: |
        Your task is to improve the reranker code so it returns more relevant results.

        Use commit_patch to edit the reranker module (validation is enforced only when enabled).
        Use evaluate to inspect training changes.
        Use search to inspect single queries.

        DO NOT rename the function in the code. You MUST keep the signature the same.

    run:
      top_k: 10
