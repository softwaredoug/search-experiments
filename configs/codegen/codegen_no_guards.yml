strategy:
  name: codegen_no_guards
  type: codegen
  params:
    train:
      model: gpt-5
      refresh_every: 5
      search_tools:
        - fielded_bm25
        - e5_base_v2
      start_code: |
        def reranker(query, top_k, fielded_bm25, e5_base_v2, **kwargs):
            docs = fielded_bm25(
                query,
                fields=["title^9.3", "description^4.1"],
                operator="or",
                top_k=top_k,
            )
            return [str(doc["id"]) for doc in docs]

        def rerank_default(query, top_k, *tool_fns, **kwargs):
            return reranker(query, top_k, *tool_fns, **kwargs)
      edit:
        guards: []
      eval:
        train_fraction: 0.20
        seed: 1234
        eval_margin: 0.003
      system_prompt: |
        Your task is to improve the reranker code so it returns more relevant results.

        Use commit_patch to edit the reranker module (validation is enforced only when enabled).
        Use evaluate to inspect training changes.
        Use search to inspect single queries.

        DO NOT rename the function in the code. You MUST keep the signature the same.

    run:
      top_k: 10
